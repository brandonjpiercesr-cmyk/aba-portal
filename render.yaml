services:
  - type: web
    name: tryaba-private-delivery
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: PORTAL_ACCESS_TOKEN
        sync: false
      - key: PORTAL_ARTIFACT_JSON
        sync: false
      - key: PORTAL_ARTIFACT_SHA256
        sync: false
      - key: PORTAL_SCOPE_DIGEST
        sync: false
      - key: PORTAL_RELATIONSHIP_AUTHORITY_RECEIPT_ID
        sync: false
      - key: PORTAL_EXPECTED_RECIPIENT
        value: Dr. Eric
