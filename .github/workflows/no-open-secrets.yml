name: no-open-secrets
# ⬡B:ci.no_open_secrets:GUARD:estate_gate_for_the_unguarded_repos:20260726⬡
# THE ESTATE GATE. The anew repo has carried no-founder-pii and rogue-scan since 20260722. This
# repo carried NOTHING, which is exactly why a git-tracked .env and live credentials as source
# defaults survived here while anew stayed clean. Same idea, same house, scoped to the holes that
# actually happened: a tracked .env, a secret literal, an open wildcard-CORS relay on a real key,
# and the forbidden process.env.X || 'literal' shape.
#
# This gate EXITS NON-ZERO. A gate that only logs is not a gate.
# It runs on pull requests AND on direct pushes, because the leaks it catches were pushed straight
# to a branch, not opened as a PR.
on:
  pull_request:
  push:
jobs:
  no-open-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan for tracked .env, secret literals and open relays
        run: node scripts/checks/no-open-secrets.cjs .
